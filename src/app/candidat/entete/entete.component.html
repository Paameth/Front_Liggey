<div class="profile-completion">
        <div class="header">
            <div class="header-icon">✓</div>
            <h1 class="header-title">Complétez votre profil avec votre CV</h1>
        </div>

        <p class="subtitle">
            Vos expériences, vos compétences et votre formation seront ajoutées à votre profil depuis votre CV
        </p>

        <div class="benefits-grid">
            <div class="benefit-item">
                <div class="benefit-icon users-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                </div>
                <p class="benefit-text">Faites-vous repérer par les entreprises</p>
            </div>

            <div class="benefit-item">
                <div class="benefit-icon briefcase-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                        <line x1="8" y1="21" x2="16" y2="21"/>
                        <line x1="12" y1="17" x2="12" y2="21"/>
                    </svg>
                </div>
                <p class="benefit-text">Recevez tous les jours des suggestions d'offres</p>
            </div>

            <div class="benefit-item">
                <div class="benefit-icon clock-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12,6 12,12 16,14"/>
                    </svg>
                </div>
                <p class="benefit-text">Postulez plus rapidement</p>
            </div>
        </div>

        <button class="download-button" onclick="handleDownload()">
            <svg class="download-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7,10 12,15 17,10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Télécharger le CV
        </button>
</div>
