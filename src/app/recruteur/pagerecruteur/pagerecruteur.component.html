<div class="row">
    <div class="col-12 col-md-12"><app-header></app-header></div>
</div>

<div class="row">
<div class="card mb-3 p-3 w-100 w-sm-75 w-md-50 w-lg-40 large profil-card">
  <div class="card-body d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-2">
    
    <div class="d-flex align-items-center gap-2 order-1 order-md-0">
      <i class="bi bi-person-workspace fs-1"></i>
      <h5 class="card-title mb-0 fw-bold">{{recruteur?.firstname}} {{recruteur?.lastname}}</h5>
    </div>

    <span 
      class="badge order-0 order-md-1"
      [ngClass]="{
        'bg-light text-danger border border-danger': !isComplete,
        'bg-light text-success border border-success': isComplete
      }">
      {{ isComplete ? 'complet' : 'pas complet' }}
    </span>
  </div>

  <ul class="infos list-unstyled d-flex flex-column gap-2 px-3 mb-3">
    <li class="d-flex align-items-center gap-2">
      <i class="bi bi-building"></i>
      <span>{{ recruteur?.nom_entreprise || 'Nom d’entreprise non défini' }}</span>
    </li>

    <li class="d-flex align-items-center gap-2">
      <i class="bi bi-briefcase"></i>
      <span>{{ recruteur?.secteur_entreprise || 'Secteur non défini' }}</span>
    </li>

    <li class="d-flex align-items-center gap-2">
      <i class="bi bi-envelope-at"></i>
      <span [ngClass]="{'text-muted fst-italic': !recruteur?.email}">
        {{ recruteur?.email || 'Ajouter une adresse mail' }}
      </span>
    </li>
  </ul>

  <div class="d-flex justify-content-end">
    <button class="btn btn-primary boutonLabel" (click)="openModal()">Modifier</button>
  </div>
</div>

<!-- Popup -->
<app-profil-recruteur
  [recruteur]="recruteur"
  [showModal]="showModal"
  (close)="closeModal()"
  (save)="saveChanges($event)">
</app-profil-recruteur>

</div>



<div class="row">
    <div class="col-12 col-md-12"><app-footer></app-footer></div>
</div>
