    <div class="carousel-container">
      <div class="carousel-wrapper">
        <div 
          class="carousel-track" 
          [style.transform]="'translateX(-' + (currentIndex() * 100) + '%)'">
          <div class="carousel-slide" *ngFor="let item of items">
            <div class="slide-content">
              <img [src]="item.image" [alt]="item.title" class="slide-image" />
              <div class="content-container">
                <h2 class="slide-title">{{ item.title }}</h2>
                <p class="slide-description">{{ item.description }}</p>
              </div>
            </div>
          </div>
        </div>
        
        <!-- Boutons de navigation 
        <button class="nav-button nav-prev" (click)="previousSlide()" [disabled]="currentIndex() === 0 && !infinite">
          ‹
        </button>
        <button class="nav-button nav-next" (click)="nextSlide()" [disabled]="currentIndex() === items.length - 1 && !infinite">
          ›
        </button>
      -->
      </div>

      <div class="pagination-dots">
        <button
          *ngFor="let item of items; let i = index"
          class="dot"
          [class.active]="i === currentIndex()"
          (click)="goToSlide(i)">
        </button>
      </div>
    </div>
